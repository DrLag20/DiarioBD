<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My ideas</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <header class="header">
        <img src="../static/img/logo.svg" alt="logo" width="30" height="30">
        <ul class="main-list">
            <li class="list__item">
              <a href="">
                <img src="../static/img/login.svg" alt="login" width="20" height="20">
              </a>
        </ul>
      </header>
      <main>
        {% block content %}
        <form action="{{ url_for('form_create') }}" method="post" class="creat-form">
            <div class="form__card">
                <img class="card__img" src="{{ url_for('static', filename='img/ambfinal.png') }}" alt="ambfinal" width="220" height="220">
                <h2 class="form__title">Escribir una idea</h2>
                <p class="form__subtitle">Escribe algo interesante</p>
                <p class="form__error">{{ error }}</p>
                <p class="form__success">{{ success }}</p>
                <p class="form__info">Los campos son obligatorios para facilitar la creación de la tarjeta</p>
                <div class="form__inputs">
                    <label for="title">
                        <input class="form__input" type="text" name="title" id="title" placeholder="Escriba el título de la entrada" required>
                    </label>
                    <label for="subtitle">
                        <input class="form__input" type="text" name="subtitle" id="subtitle" placeholder="Escriba el título secundario" required>
                    </label>
                </div>
                <label for="text">
                    <textarea class="form__text" name="text" id="text" cols="30" rows="10" required placeholder="Escribe algo de texto..."></textarea>
                </label>
                <label for="date">
                    <input class="form__input" type="date" name="date" id="date" required>
                </label>
                <label for="category">
                    <select class="form__input" name="category" id="category" required>
                        <option value="" disabled selected>Seleccione una categoría</option>
                        <option value="Categoría: Clima">Clima</option>
                        <option value="Categoría: Ambiente">Ambiente</option>
                        <option value="Categoría: Vida">Vida</option>
                        <option value="Categoría: Otro">Otro</option>
                    </select>
                </label>
                <label for="tags">
                    <input class="form__input" type="text" name="tags" id="tags" placeholder="Escriba las etiquetas separadas por comas" required>
                </label>
                <label for="author">
                    <input class="form__input" type="text" name="author" id="author" placeholder="Escriba el nombre del autor" required>
                </label>
                <button class="form__button">Crear</button>
            </div>
        </form>
        {% endblock %}
      </main>
</body>
</html>
